<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بازی ۲۰۴۸</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>۲۰۴۸</h1>
      <p class="tagline">کاشی‌های هم‌عدد را به هم برسانید و به ۲۰۴۸ برسید!</p>
    </div>
    <div class="scores">
      <div class="score-box">
        <span>امتیاز</span>
        <b id="score">۰</b>
      </div>
      <div class="score-box">
        <span>بهترین</span>
        <b id="best">۰</b>
      </div>
    </div>
  </header>

  <div class="controls">
    <p>با کلیدهای جهت‌نما یا کشیدن انگشت روی صفحه حرکت کنید.</p>
    <div class="buttons">
      <button id="undo" disabled>↩ لغو حرکت</button>
      <button id="new-game">بازی جدید</button>
    </div>
  </div>

  <div id="board" dir="ltr">
    <div id="grid"></div>
    <div id="tiles"></div>
    <div id="overlay" hidden>
      <div class="overlay-card">
        <h2 id="overlay-title"></h2>
        <p id="overlay-text"></p>
        <div class="overlay-buttons">
          <button id="keep-going" hidden>ادامه بازی</button>
          <button id="overlay-restart">بازی جدید</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    کلیدهای جهت‌نما یا WASD برای حرکت • کلید U برای لغو حرکت<br>
    بعد از رسیدن به کاشی ۲۰۴۸ می‌توانید بازی را ادامه دهید.
  </footer>
</main>
<script type="module" src="/src.js"></script>
</body>
</html>
