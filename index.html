<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151223">
<title>۲۰۴۸ | باشگاه معما</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top"><div class="brand"><span class="logo" aria-hidden="true">▦</span><span>PUZZLE<span class="accent">.</span> CLUB</span></div><span class="edition"><i></i> CLASSIC EDITION</span></header>
<main>
<section class="intro" aria-labelledby="title">
  <div class="chapter"><span></span> THE NUMBER PUZZLE <b>01</b></div>
  <h1 id="title" aria-label="۲۰۴۸">2048<span>.</span></h1>
  <p class="tagline" dir="rtl">دو تا یکی می‌شن.</p>
  <p class="description" dir="rtl">کاشی‌های هم‌عدد را کنار هم بگذار، آن‌ها را ادغام کن و به کاشی ۲۰۴۸ برس.</p>
  <div class="instructions" dir="rtl"><h2>چطور بازی کنیم؟</h2><p>با کلیدهای جهت‌نما یا کشیدن انگشت روی صفحه، کاشی‌ها را حرکت بده.</p><div class="keys" dir="ltr" aria-hidden="true"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></div></div>
</section>
<section class="game" aria-label="بازی ۲۰۴۸">
  <div class="stats" dir="rtl"><div><span>امتیاز فعلی</span><strong id="score">0</strong></div><div><span>بهترین امتیاز</span><strong id="best">0</strong></div></div>
  <div class="board-shell"><div id="board" tabindex="0" aria-label="صفحهٔ چهار در چهار"><div class="cells" aria-hidden="true"></div><div class="tiles"></div></div>
  <div id="result" class="result" dir="rtl" hidden><div><h2 id="result-title"></h2><p id="result-text" role="status"></p><button id="result-action" class="primary"></button></div></div></div>
  <div class="actions" dir="rtl"><button id="restart" class="primary"><span aria-hidden="true">⟳</span> شروع مجدد</button><button id="undo"><span aria-hidden="true">↶</span> لغو حرکت</button></div>
</section>
</main>
<footer><span>PUZZLE CLUB / 001</span><span>4 × 4 <i></i> 2048</span></footer>
<script type="module" src="./src.js"></script>
</body>
</html>
